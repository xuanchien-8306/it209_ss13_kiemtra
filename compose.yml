services:
  mysql:
    image: mysql:8.0
    container_name: campus-hub-mysql
    environment:
      MYSQL_ROOT_PASSWORD: "080306@"
      MYSQL_DATABASE: campus_hub
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p080306@"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: campus-hub-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campus-hub-backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/campus_hub?createDatabaseIfNotExist=true
      DB_USERNAME: root
      DB_PASSWORD: "080306@"
      SERVER_PORT: 8080
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data: